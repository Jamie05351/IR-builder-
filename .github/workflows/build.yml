name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core:test :desktop:compileKotlin
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

  windows:
    name: Windows packages
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build .exe installer and portable app
        shell: pwsh
        run: ./gradlew.bat --no-daemon :desktop:packageExe :desktop:createDistributable
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/JDSP-IR-Builder -DestinationPath JDSP-IR-Builder-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JDSP-IR-Builder-installer
          path: desktop/build/compose/binaries/main/exe/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JDSP-IR-Builder-portable
          path: JDSP-IR-Builder-portable.zip
